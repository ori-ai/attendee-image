name: build-attendee-image
# Builds the open-source Attendee meeting bot (attendee-labs/attendee) at a pinned commit
# and publishes it to GHCR so a small VPS can pull it instead of building it.
on:
  workflow_dispatch:
    inputs:
      attendee_ref:
        description: "attendee-labs/attendee commit or tag"
        default: "3cbeb69fb838bbcb9ef6915f4c1e04b5a1c08e2c"
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - uses: actions/checkout@v4
        with:
          repository: attendee-labs/attendee
          ref: ${{ inputs.attendee_ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/attendee:${{ inputs.attendee_ref }}
            ghcr.io/${{ github.repository_owner }}/attendee:latest
